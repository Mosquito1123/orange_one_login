name: orange_one_login
description: 开源的一键登录 Flutter 业务客户端。流程参考运营商认证的公开步骤，不捆绑第三方闭源原生 SDK。
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  http: ^1.2.2
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
